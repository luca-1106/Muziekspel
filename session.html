<!doctype html>
<html lang="nl">
<head>

<body class="session-page">
  <main class="app-shell">
    <header class="topbar"><a class="back-button" href="index.html" aria-label="Terug naar startpagina">←</a><div><p class="eyebrow">ACTIEVE SESSIE</p><h1 id="sessionTitle">Muziekmix<span>.</span></h1></div><span id="sessionCount" class="session-count">0 / 0</span></header>
    <section class="intro compact-intro" aria-live="polite"><div class="status-line"><span id="statusDot" class="status-dot"></span><span id="statusText">Sessie voorbereiden…</span></div><p id="instruction">We maken Safari klaar als Spotify-afspeelapparaat.</p></section>
    <section class="player-card" aria-label="Spotify-speler"><div class="album-wrap"><img id="albumArt" class="album-art" alt="Albumhoes" hidden><div id="albumFallback" class="vinyl" aria-hidden="true"><div class="vinyl-label">♫</div></div></div><div class="now-playing"><p class="eyebrow">NU AAN HET SPELEN</p><h2 id="trackTitle">Sessie voorbereiden…</h2><p id="trackArtist">Even geduld.</p><a id="trackLink" class="spotify-link" href="https://open.spotify.com" target="_blank" rel="noopener" title="Opent deze track in Spotify en kan hem opnieuw starten" hidden>Bekijk track in Spotify ↗</a></div><div class="progress-wrap"><div class="progress-meta"><span id="playState">STARTEN</span><span id="timeLabel">0:00</span></div><div class="progress-track"><div id="progressBar" class="progress-bar"></div></div></div><p id="errorMessage" class="error-message" role="alert" hidden></p><div class="controls"><button id="startPlayback" class="primary-button full-control" type="button" disabled><span class="button-icon">▶</span><span>Start afspelen in deze browser</span></button><button id="pauseButton" class="secondary-button" type="button" disabled><span class="button-icon">Ⅱ</span><span>Pauzeer</span></button><button id="nextButton" class="primary-button" type="button" disabled><span class="button-icon">↷</span><span>Volgend nummer</span></button><button id="endSession" class="text-button full-control" type="button">Sessie beëindigen</button></div><p class="small-note">Audio speelt in deze browser. Spotify hoeft niet op de voorgrond te staan.</p></section>
  </main>

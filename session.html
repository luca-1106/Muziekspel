<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121411"><meta name="description" content="Je actieve Muziekmix-sessie.">
  <title>Sessie · Muziekmix</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css?v=match-fix-1"><link rel="stylesheet" href="session.css?v=progress-only-1">
</head>
<body class="session-page">
  <main class="app-shell">
    <header class="topbar"><a class="back-button" href="index.html" aria-label="Terug naar startpagina">←</a><div><p class="eyebrow">ACTIEVE SESSIE</p><h1 id="sessionTitle">Muziekmix<span>.</span></h1></div><span id="sessionCount" class="session-count">0 / 0</span></header>
    <section class="intro compact-intro" aria-live="polite"><div class="status-line"><span id="statusDot" class="status-dot"></span><span id="statusText">Sessie voorbereiden…</span></div><p id="instruction">We maken Safari klaar als Spotify-afspeelapparaat.</p></section>
    <section class="player-card awaiting-playback" aria-label="Spotify-speler"><div class="album-wrap"><img id="albumArt" class="album-art" alt="Albumhoes" hidden><div id="albumFallback" class="vinyl" aria-hidden="true"><div class="vinyl-label">♫</div></div><button id="startPlayback" class="browser-play-button" type="button" aria-label="Start afspelen in deze browser" disabled><span aria-hidden="true">▶</span></button></div><div class="now-playing"><p id="trackYear" class="track-year" hidden></p><h2 id="trackTitle">Sessie voorbereiden…</h2><p id="trackArtist" class="track-artist">Even geduld.</p></div><div class="progress-wrap"><div class="progress-track" role="progressbar" aria-label="Voortgang van het nummer" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progressBar" class="progress-bar"></div></div></div><p id="errorMessage" class="error-message" role="alert" hidden></p><div class="controls"><button id="pauseButton" class="secondary-button" type="button" disabled><span class="button-icon">Ⅱ</span><span>Pauzeer</span></button><button id="nextButton" class="primary-button" type="button" disabled><span class="button-icon">↷</span><span>Volgend nummer</span></button><button id="endSession" class="text-button full-control" type="button">Sessie beëindigen</button></div></section>
  </main>
  <script src="config.js?v=player-auth-1"></script><script src="tracks.js"></script><script src="spotify.js?v=player-auth-1"></script><script src="https://sdk.scdn.co/spotify-player.js"></script><script src="session.js?v=progress-only-1"></script>
</body>
</html>
